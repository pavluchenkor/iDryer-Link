; ── Публикация во флешер ──────────────────────────────────────────────────
; Бинарник уезжает в flasher-portal (и дальше в OTA портала) АВТОМАТИЧЕСКИ —
; только с ветки main/master и только когда на HEAD висит тег vX.Y.Z, равный
; версии прошивки. Для стенда, до мержа и тегов:
;   IDRYER_FLASHER_FORCE=1 pio run -e <env>
; Проверки ветки и тега пропускаются, всё остальное — как при релизе.
; Путь к флешеру берётся из IDRYER_FLASHER_PORTAL_PATH.
;
; PlatformIO Project Configuration File
;
; Структура: [env] + [flags_*] + [env:*]
; extra_scripts в [env:*] перезапписывает [env], а не дополняет,
; поэтому pre + post нужно указывать явно в каждом env.
;
; pio run -e esp32c3-super-mini-stage -t clean -t upload -t monitor

[platformio]
default_envs = esp32c3-prod, esp32c3-super-mini-prod, xiao-esp32s3-prod, waveshare-esp32s3-zero-prod

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = idryer_4mb.csv
upload_port = /dev/cu.usbmodem114201
monitor_port = /dev/cu.usbmodem114201
monitor_speed = 115200
monitor_raw = yes
; Общие зависимости (MQTT, ArduinoJson, WebSockets, Improv-форк) приходят
; транзитивно из lib/idryer-core → library.json → dependencies.
lib_deps =
  densaugeo/base64 @ ^1.4.0
; ESPAsyncTCP — ESP8266-транспорт из манифеста espMqttClient; как транзитивная
; зависимость 2-го уровня ставится без учёта platforms-фильтра и ломает сборку.
lib_ignore = ESPAsyncTCP

[flags_idryer]
build_flags =
  ; Стек главной задачи. Дефолтных 8 КБ не хватает на TLS-рукопожатие
  ; при привязке — устройство падало со stack overflow. Ядро уводит
  ; HTTPS в свою задачу, это запас для остального кода в loop().
  -DARDUINO_LOOP_STACK_SIZE=16384
  ; Интеграции: принтеры у сушилки не через link — Bambu в образ не собирается.
  -DIDRYER_WITH_BAMBU=0
  -DDEBUG_SERIAL=Serial
  -Iinclude
  ; espMqttClient: входящие команды/OTA-чанки до 16КБ одним куском (как было
  ; с PubSubClient setBufferSize). Без флага дефолт 1440 байт → payload частями.
  -DEMC_RX_BUFFER_SIZE=16384

; USB CDC (нативный USB) — для super-mini, XIAO S3, Waveshare S3 Zero.
; Devkit ESP32-C3 (esp32c3-prod/-stage) использует UART через CH340/CP2102 — без CDC.
[flags_usb_cdc]
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Wi-Fi TX-мощность для плат со слабым регулятором питания (ESP32-C3 Super Mini):
; дефолтные 19.5 dBm вызывают просадку питания и обрывы Wi-Fi, поэтому режем до 8.5 dBm.
; Платы с нормальной антенной/питанием (devkit, XIAO S3) флаг не подключают → дефолт SDK.
; typedef enum {
;     WIFI_POWER_19_5dBm = 78,// 19.5dBm
;     WIFI_POWER_19dBm = 76,// 19dBm
;     WIFI_POWER_18_5dBm = 74,// 18.5dBm
;     WIFI_POWER_17dBm = 68,// 17dBm
;     WIFI_POWER_15dBm = 60,// 15dBm
;     WIFI_POWER_13dBm = 52,// 13dBm
;     WIFI_POWER_11dBm = 44,// 11dBm
;     WIFI_POWER_8_5dBm = 34,// 8.5dBm
;     WIFI_POWER_7dBm = 28,// 7dBm
;     WIFI_POWER_5dBm = 20,// 5dBm
;     WIFI_POWER_2dBm = 8,// 2dBm
;     WIFI_POWER_MINUS_1dBm = -4// -1dBm
; } wifi_power_t;
[flags_wifi_supermini]
build_flags =
  -DIDRYER_WIFI_TX_POWER=WIFI_POWER_8_5dBm

; PRODUCTION — боевой сервер
[flags_prod]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DIDRYER_PORTAL_HOST=\"portal.idryer.org\"
  -DIDRYER_PORTAL_PORT=443
  -DIDRYER_PORTAL_USE_TLS=1
  -DIDRYER_API_BASE=\"https://portal.idryer.org/api\"
  -DIDRYER_SOCKET_PATH=\"/socket.io/?EIO=4\"
  -DMQTT_BROKER=\"mqtt.idryer.org\"
  -DMQTT_PORT=8883
  -DMQTT_USE_TLS=1

; STAGING — тестовый сервер
; MQTT: staging.idryer.org:1884 без TLS (nginx stream proxy → EMQX staging)
[flags_stage]
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DIDRYER_PORTAL_HOST=\"staging.idryer.org\"
  -DIDRYER_PORTAL_PORT=443
  -DIDRYER_PORTAL_USE_TLS=1
  -DIDRYER_API_BASE=\"https://staging.idryer.org/api\"
  -DIDRYER_SOCKET_PATH=\"/socket.io/?EIO=4\"
  -DMQTT_BROKER=\"staging.idryer.org\"
  -DMQTT_PORT=1884
  -DMQTT_USE_TLS=0

; LOCAL — локальный dev-сервер для тестирования миграции v2
[flags_local]
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DIDRYER_API_BASE=\"http://192.168.1.107:3000\"
  -DMQTT_BROKER=\"192.168.1.107\"
  -DMQTT_PORT=1883
  -DMQTT_USE_TLS=0

; LOCAL-AUTH — локальный стенд binding-v2: брокер с go-auth (порт 1884),
; авторизация как в проде (пара логин+токен через /mqtt/auth|acl), но без TLS.
; Поднять брокер: docker compose --profile auth up -d mosquitto-dev-auth
[flags_local_auth]
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DIDRYER_API_BASE=\"http://192.168.1.107:3000\"
  -DMQTT_BROKER=\"192.168.1.107\"
  -DMQTT_PORT=1884
  -DMQTT_USE_TLS=0

; =============================================================================
; ESP32-C3 DevKitM (UART через CH340/CP2102, без USB CDC)
; =============================================================================
[env:esp32c3-prod]
extra_scripts =
  pre:extra_scripts/copy_menu.py
  post:extra_scripts/post_build.py
build_flags =
  ${flags_idryer.build_flags}
  ${flags_prod.build_flags}
  -DHW_LINK=\"esp32c3-devkitm\"

[env:esp32c3-stage]
extra_scripts =
  pre:extra_scripts/copy_menu.py
  post:extra_scripts/stage_auto_claim.py
build_flags =
  ${flags_idryer.build_flags}
  ${flags_stage.build_flags}
  -DHW_LINK=\"esp32c3-devkitm\"

; =============================================================================
; ESP32-C3 Super Mini (нативный USB CDC)
; =============================================================================
[env:esp32c3-super-mini-prod]
extra_scripts =
  pre:extra_scripts/copy_menu.py
  post:extra_scripts/post_build.py
build_flags =
  ${flags_idryer.build_flags}
  ${flags_usb_cdc.build_flags}
  ${flags_wifi_supermini.build_flags}
  ${flags_prod.build_flags}
  -DHW_LINK=\"esp32c3-super-mini\"

[env:esp32c3-super-mini-stage]
extra_scripts =
  pre:extra_scripts/copy_menu.py
  post:extra_scripts/stage_auto_claim.py
build_flags =
  ${flags_idryer.build_flags}
  ${flags_usb_cdc.build_flags}
  ${flags_wifi_supermini.build_flags}
  ${flags_stage.build_flags}
  -DHW_LINK=\"esp32c3-super-mini\"

; Локальный сервер — без post_build и без auto_claim.
[env:esp32c3-super-mini-local]
extra_scripts =
  pre:extra_scripts/copy_menu.py
build_flags =
  ${flags_idryer.build_flags}
  ${flags_usb_cdc.build_flags}
  ${flags_wifi_supermini.build_flags}
  ${flags_local.build_flags}
  -DHW_LINK=\"esp32c3-super-mini\"
  ; -DCORE_DEBUG_LEVEL=3
  ; -DIDRYER_DEV_REPL=1

; binding-v2: локальный стенд с авторизацией (брокер go-auth на 1884)
[env:esp32c3-super-mini-local-auth]
extra_scripts =
  pre:extra_scripts/copy_menu.py
  ; Публикация во флешер со стенда — только при IDRYER_FLASHER_FORCE=1 (см. шапку).
  post:extra_scripts/post_build.py
build_flags =
  ${flags_idryer.build_flags}
  ${flags_usb_cdc.build_flags}
  ${flags_wifi_supermini.build_flags}
  ${flags_local_auth.build_flags}
  ; Ход настройки Wi-Fi по воздуху в USB-лог — иначе фаза до подключения
  ; не видна вовсе (HAL до Wi-Fi молчит).
  -DIDRYER_ESPTOUCH_LOG=1
  -DHW_LINK=\"esp32c3-super-mini\"


; v2 (idryer-core) — PRODUCTION (алиас esp32c3-super-mini-prod, оставлен для совместимости команд)
[env:esp32c3-super-mini-v2-prod]
extra_scripts =
  pre:extra_scripts/copy_menu.py
  post:extra_scripts/post_build.py
build_flags =
  ${flags_idryer.build_flags}
  ${flags_usb_cdc.build_flags}
  ${flags_wifi_supermini.build_flags}
  ${flags_prod.build_flags}
  -DHW_LINK=\"esp32c3-super-mini\"

; =============================================================================
; Seeed Studio XIAO ESP32S3
; =============================================================================
[env:xiao-esp32s3-prod]
board = seeed_xiao_esp32s3
extra_scripts =
  pre:extra_scripts/copy_menu.py
  post:extra_scripts/post_build.py
build_flags =
  ${flags_idryer.build_flags}
  ${flags_usb_cdc.build_flags}
  ${flags_prod.build_flags}
  -DHW_LINK=\"xiao-esp32s3\"

[env:xiao-esp32s3-stage]
board = seeed_xiao_esp32s3
extra_scripts =
  pre:extra_scripts/copy_menu.py
  post:extra_scripts/stage_auto_claim.py
build_flags =
  ${flags_idryer.build_flags}
  ${flags_usb_cdc.build_flags}
  ${flags_stage.build_flags}
  -DHW_LINK=\"xiao-esp32s3\"

; =============================================================================
; Waveshare ESP32-S3-Zero
; Официального board ID нет — используем esp32-s3-devkitc-1 с поправками на 4MB flash.
; =============================================================================
[env:waveshare-esp32s3-zero-prod]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = idryer_4mb.csv
extra_scripts =
  pre:extra_scripts/copy_menu.py
  post:extra_scripts/post_build.py
build_flags =
  ${flags_idryer.build_flags}
  ${flags_usb_cdc.build_flags}
  ${flags_prod.build_flags}
  -DHW_LINK=\"waveshare-esp32s3-zero\"

[env:waveshare-esp32s3-zero-stage]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = idryer_4mb.csv
extra_scripts =
  pre:extra_scripts/copy_menu.py
  post:extra_scripts/stage_auto_claim.py
build_flags =
  ${flags_idryer.build_flags}
  ${flags_usb_cdc.build_flags}
  ${flags_stage.build_flags}
  -DHW_LINK=\"waveshare-esp32s3-zero\"
